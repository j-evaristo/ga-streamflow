name: Update GA streamflow data and deploy

on:
  schedule:
    - cron: "17 10 * * *"    # daily at 10:17 UTC (~6:17 am Eastern) — after USGS posts yesterday's daily values
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]          # also redeploy whenever you change the code

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all GA daily discharge from USGS
        run: python download_ga_discharge.py
        env:
          DV_RETRY_BUDGET_MIN: "12"   # straggler retry rounds before the archive fallback
        timeout-minutes: 40

      - name: Build viewer data files
        run: python build_viewer_data.py

      - name: Assemble site
        run: |
          mkdir -p site/data
          cp ga_streamflow_explorer.html site/index.html
          cp data/sites_index.js site/data/
          cp data/sites_metadata.csv site/data/
          cp -r data/sites site/data/sites
          du -sh site

      - name: Update the dataset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf /tmp/dataset.tar.gz -C data csv sites_metadata.csv raw/ga_sites_expanded.rdb raw/ga_series_catalog.rdb raw/fl_border_sites_expanded.rdb raw/fl_border_series_catalog.rdb
          gh release view dataset >/dev/null 2>&1 ||             gh release create dataset --title "Complete dataset (CSV)"               --notes "Nightly-refreshed archive of all station CSVs and metadata. Source: USGS NWIS; recent values provisional."
          gh release upload dataset /tmp/dataset.tar.gz --clobber
          echo "dataset release updated"

      # Per-attempt artifact name: reruns share the run's artifact namespace,
      # so a fixed name collides with an earlier attempt's upload.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # GitHub's artifact listing can lag just after upload; one more try.
      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
